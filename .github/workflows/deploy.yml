name: Deploy to GitHub Pages

# Every push to master builds the site and publishes dist/ to
# shubham-0707/shubham-0707.github.io (the repo GitHub Pages serves).
on:
  push:
    branches: [master]
  workflow_dispatch: # allows a manual run from the Actions tab

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and pre-render
        run: npm run build

      - name: Publish dist/ to shubham-0707.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          deploy_key: ${{ secrets.PAGES_DEPLOY_KEY }}
          external_repository: shubham-0707/shubham-0707.github.io
          publish_branch: main
          publish_dir: ./dist
          user_name: github-actions[bot]
          user_email: github-actions[bot]@users.noreply.github.com
          commit_message: Deploy from my-portfolio-react
